<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jobscan 🇩🇪 — Job Pipeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    .card-yes  { border-left-color: #10b981; }
    .card-no   { border-left-color: #ef4444; }
    .card-pend { border-left-color: #3b82f6; }
  </style>
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased"
      x-data="app()" x-init="load()">

  <!-- ── Loading ──────────────────────────────────────────── -->
  <div x-show="loading" x-cloak
       class="flex flex-col items-center justify-center h-screen gap-4 text-gray-400">
    <svg class="w-10 h-10 animate-spin text-blue-500" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
    </svg>
    <p>Loading pipeline…</p>
  </div>

  <!-- ── Error ─────────────────────────────────────────────── -->
  <div x-show="!loading && error" x-cloak
       class="flex flex-col items-center justify-center h-screen gap-4 text-center px-6">
    <div class="text-5xl">📭</div>
    <h2 class="text-xl font-semibold text-red-400">No results yet</h2>
    <p class="text-gray-400 max-w-sm">
      Run <code class="bg-gray-800 px-1 rounded">python scan.py</code> then
      <code class="bg-gray-800 px-1 rounded">python eval.py</code> then
      <code class="bg-gray-800 px-1 rounded">python export.py</code> and push.
    </p>
  </div>

  <!-- ── Main ──────────────────────────────────────────────── -->
  <div x-show="!loading && !error" x-cloak>

    <!-- Sticky header -->
    <header class="sticky top-0 z-20 bg-gray-900/95 backdrop-blur border-b border-gray-800">
      <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight">🔍 Jobscan <span class="text-blue-400">🇩🇪</span></h1>
          <p class="text-xs text-gray-500 leading-none mt-0.5">Germany + Remote</p>
        </div>
        <div class="text-right text-xs text-gray-500 shrink-0">
          <p>Last updated</p>
          <p class="text-gray-300" x-text="updatedAt"></p>
        </div>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-5">

      <!-- Stats row -->
      <div class="grid grid-cols-4 gap-2 sm:gap-3 mb-5">
        <div class="bg-gray-900 rounded-xl p-3 text-center">
          <p class="text-xl sm:text-2xl font-bold" x-text="stats.total ?? 0"></p>
          <p class="text-xs text-gray-500 mt-0.5">Total</p>
        </div>
        <div class="bg-gray-900 rounded-xl p-3 text-center ring-1 ring-inset ring-emerald-500/40">
          <p class="text-xl sm:text-2xl font-bold text-emerald-400" x-text="stats.yes ?? 0"></p>
          <p class="text-xs text-gray-500 mt-0.5">✓ Fit</p>
        </div>
        <div class="bg-gray-900 rounded-xl p-3 text-center ring-1 ring-inset ring-blue-500/40">
          <p class="text-xl sm:text-2xl font-bold text-blue-400" x-text="stats.pending ?? 0"></p>
          <p class="text-xs text-gray-500 mt-0.5">⏳ Pending</p>
        </div>
        <div class="bg-gray-900 rounded-xl p-3 text-center ring-1 ring-inset ring-red-500/30">
          <p class="text-xl sm:text-2xl font-bold text-red-400" x-text="stats.no ?? 0"></p>
          <p class="text-xs text-gray-500 mt-0.5">✗ No</p>
        </div>
      </div>

      <!-- Tabs -->
      <div class="flex gap-1 bg-gray-900 p-1 rounded-xl mb-4 text-sm">
        <template x-for="tab in tabs" :key="tab.key">
          <button
            @click="activeTab = tab.key"
            :class="activeTab === tab.key
              ? 'bg-gray-700 text-white shadow'
              : 'text-gray-400 hover:text-gray-200'"
            class="flex-1 py-1.5 px-2 rounded-lg font-medium transition-all truncate">
            <span x-text="tab.label"></span>
            <span class="ml-1 text-xs opacity-70"
                  x-text="'(' + getTabJobs(tab.key).length + ')'"></span>
          </button>
        </template>
      </div>

      <!-- Empty state per tab -->
      <div x-show="currentJobs.length === 0"
           class="text-center py-16 text-gray-500">
        <p class="text-3xl mb-3">🗂️</p>
        <p x-text="emptyMessage"></p>
      </div>

      <!-- Job cards -->
      <div class="space-y-2">
        <template x-for="job in currentJobs" :key="job.url">
          <div class="bg-gray-900 rounded-xl border-l-4 p-4 hover:bg-gray-800/80 transition-colors"
               :class="{
                 'card-yes':  job.fit === 'yes',
                 'card-no':   job.fit === 'no',
                 'card-pend': job.status === 'pending'
               }">
            <div class="flex gap-3">
              <!-- Score badge -->
              <div class="shrink-0 text-center w-12 mt-0.5">
                <template x-if="job.score !== null">
                  <div>
                    <div class="text-lg font-bold leading-none"
                         :class="job.fit === 'yes' ? 'text-emerald-400' : 'text-red-400'"
                         x-text="job.score.toFixed(1)"></div>
                    <div class="text-xs mt-0.5"
                         :class="job.fit === 'yes' ? 'text-emerald-500' : 'text-red-500'"
                         x-text="job.fit === 'yes' ? '✓ YES' : '✗ NO'"></div>
                  </div>
                </template>
                <template x-if="job.score === null">
                  <div class="text-blue-400 text-xs">⏳<br>eval</div>
                </template>
              </div>

              <!-- Content -->
              <div class="flex-1 min-w-0">
                <a :href="job.url" target="_blank" rel="noopener"
                   class="font-semibold text-sm sm:text-base leading-snug hover:text-blue-300 transition-colors block">
                  <span x-text="job.title"></span>
                  <span class="text-gray-400 font-normal" x-text="' at ' + job.company"></span>
                  <svg class="inline-block w-3 h-3 ml-1 opacity-50 -mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                  </svg>
                </a>

                <!-- Tags row -->
                <div class="flex flex-wrap items-center gap-1.5 mt-2">
                  <span x-show="job.source"
                        class="bg-gray-800 text-gray-400 text-xs px-1.5 py-0.5 rounded"
                        x-text="job.source"></span>
                  <span x-show="job.location"
                        class="text-gray-500 text-xs"
                        x-text="'📍 ' + job.location"></span>
                  <span x-show="job.remote"
                        class="bg-blue-950 text-blue-400 text-xs px-1.5 py-0.5 rounded">
                    🌍 remote
                  </span>
                </div>

                <!-- AI reason -->
                <p x-show="job.reason"
                   class="text-xs text-gray-400 mt-2 italic leading-relaxed"
                   x-text="job.reason"></p>
              </div>
            </div>
          </div>
        </template>
      </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-700 py-6">
      Jobscan Germany · <span x-text="updatedAt"></span>
    </footer>
  </div>

  <script>
    function app() {
      return {
        loading: true,
        error: false,
        stats: {},
        jobs: [],
        activeTab: 'yes',
        updatedAt: '',

        tabs: [
          { key: 'yes',     label: '✓ Good Fits' },
          { key: 'pending', label: '⏳ Pending'   },
          { key: 'no',      label: '✗ No Fits'   },
          { key: 'all',     label: 'All'           },
        ],

        async load() {
          try {
            const resp = await fetch('results.json?t=' + Date.now());
            if (!resp.ok) throw new Error('not found');
            const data = await resp.json();
            this.jobs = data.jobs || [];
            this.stats = data.stats || {};
            const d = new Date(data.updated_at);
            this.updatedAt = isNaN(d) ? '—' : d.toLocaleString(undefined, {
              month: 'short', day: 'numeric',
              hour: '2-digit', minute: '2-digit'
            });
            // Default to pending tab if nothing is evaluated yet
            if (this.getTabJobs('yes').length === 0 && this.getTabJobs('pending').length > 0) {
              this.activeTab = 'pending';
            }
          } catch (_) {
            this.error = true;
          }
          this.loading = false;
        },

        getTabJobs(key) {
          if (key === 'yes')     return this.jobs.filter(j => j.fit === 'yes').sort((a,b) => (b.score||0)-(a.score||0));
          if (key === 'no')      return this.jobs.filter(j => j.fit === 'no').sort((a,b) => (b.score||0)-(a.score||0));
          if (key === 'pending') return this.jobs.filter(j => j.status === 'pending');
          return [...this.jobs].sort((a,b) => (b.score||0)-(a.score||0));
        },

        get currentJobs() { return this.getTabJobs(this.activeTab); },

        get emptyMessage() {
          const msgs = {
            yes:     'No good fits yet — run Scan then Evaluate.',
            pending: 'No pending jobs — run Scan to fetch new listings.',
            no:      'No no-fit jobs yet.',
            all:     'Pipeline is empty.',
          };
          return msgs[this.activeTab] || '';
        },
      }
    }
  </script>
</body>
</html>
